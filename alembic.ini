# Alembic configuration file.
#
# This file is used by Alembic to locate migration scripts and
# connect to the target database.  The ``sqlalchemy.url`` value is
# overridden at runtime by ``migrations/env.py`` which reads the
# connection string from the application settings.

[alembic]
# Path to migration scripts (relative to this file).
script_location = migrations

# Template used to generate migration file names.
# Includes a short revision hash and a slug of the message.
file_template = %%(rev)s_%%(slug)s

# Timezone for ``revision_environment``.
# timezone =

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command (e.g. to autogenerate).
# revision_environment = false

# The URL will be overridden programmatically in env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run a formatter after generating migrations:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

# ── Logging ──────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
